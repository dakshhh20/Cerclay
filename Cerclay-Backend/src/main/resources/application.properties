spring.application.name=cerclay-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cerclay?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.admin.email=${CERCLAY_ADMIN_EMAIL:}
app.admin.password=${CERCLAY_ADMIN_PASSWORD:}

shadowfax.base-url=${SHADOWFAX_BASE_URL:https://dale.staging.shadowfax.in/api}
shadowfax.api-token=${SHADOWFAX_API_TOKEN:}
shadowfax.pickup-name=${SHADOWFAX_PICKUP_NAME:}
shadowfax.pickup-contact=${SHADOWFAX_PICKUP_CONTACT:}
shadowfax.pickup-address-line1=${SHADOWFAX_PICKUP_ADDRESS_LINE1:}
shadowfax.pickup-address-line2=${SHADOWFAX_PICKUP_ADDRESS_LINE2:}
shadowfax.pickup-city=${SHADOWFAX_PICKUP_CITY:}
shadowfax.pickup-state=${SHADOWFAX_PICKUP_STATE:}
shadowfax.pickup-pincode=${SHADOWFAX_PICKUP_PINCODE:}
shadowfax.pickup-unique-code=${SHADOWFAX_PICKUP_UNIQUE_CODE:}

shadowfax.rts-name=${SHADOWFAX_RTS_NAME:}
shadowfax.rts-contact=${SHADOWFAX_RTS_CONTACT:}
shadowfax.rts-address-line1=${SHADOWFAX_RTS_ADDRESS_LINE1:}
shadowfax.rts-address-line2=${SHADOWFAX_RTS_ADDRESS_LINE2:}
shadowfax.rts-city=${SHADOWFAX_RTS_CITY:}
shadowfax.rts-state=${SHADOWFAX_RTS_STATE:}
shadowfax.rts-pincode=${SHADOWFAX_RTS_PINCODE:}
shadowfax.rts-unique-code=${SHADOWFAX_RTS_UNIQUE_CODE:}
shadowfax.rts-email=${SHADOWFAX_RTS_EMAIL:}

google.client-id=${GOOGLE_CLIENT_ID:}

app.uploads.product-dir=${CERCLAY_PRODUCT_UPLOAD_DIR:${user.home}/.cerclay/uploads/products}
app.uploads.return-dir=${CERCLAY_RETURN_UPLOAD_DIR:${user.home}/.cerclay/uploads/returns}
app.uploads.public-base-url=${CERCLAY_PRODUCT_PUBLIC_BASE_URL:http://localhost:8080/uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.notifications.mail-enabled=${CERCLAY_MAIL_ENABLED:false}
app.notifications.from=${CERCLAY_MAIL_FROM:}
app.notifications.poll-ms=${CERCLAY_NOTIFICATION_POLL_MS:30000}

razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.configuration-id=${RAZORPAY_CONFIGURATION_ID:}

cashfree.enabled=${CASHFREE_ENABLED:false}
cashfree.client-id=${CASHFREE_CLIENT_ID:}
cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
cashfree.webhook-secret=${CASHFREE_WEBHOOK_SECRET:}
cashfree.api-version=${CASHFREE_API_VERSION:2025-01-01}
cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com/pg}
cashfree.return-url=${CASHFREE_RETURN_URL:http://localhost:5174/checkout?cashfree_order_id={order_id}}

shadowfax.tracking.poll-ms=${SHADOWFAX_TRACKING_POLL_MS:900000}
shadowfax.webhook-secret=${SHADOWFAX_WEBHOOK_SECRET:}
